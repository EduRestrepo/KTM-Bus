<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960" width="1800" height="960" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1800" height="960" fill="#0e1117"/>
<rect width="1800" height="70" fill="#121722"/>
<rect width="8" height="70" fill="#ff6a13"/>
<text x="30" y="32" font-size="24" font-weight="bold" fill="#ff6a13">KTM 1290 CANsmart · HOJA 3/4 — SEÑALES PWM  (LILYGO → PLACA MOSFET)</text>
<text x="30" y="56" font-size="14" fill="#9ca3af">Cinco cables rectos entre el header de la LILYGO y las entradas de la placa MOSFET · señal 3,3 V</text>
<rect x="60" y="140" width="640" height="480" rx="10" fill="#161b26" stroke="#10b981" stroke-width="2.5"/>
<rect x="60" y="140" width="640" height="34" rx="10" fill="#10b981"/>
<rect x="60" y="164" width="640" height="10" fill="#10b981"/>
<text x="74" y="163.0" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">LILYGO T-CAN485 · header GPIO (salidas PWM)</text>
<rect x="1100" y="140" width="640" height="480" rx="10" fill="#161b26" stroke="#1d4ed8" stroke-width="2.5"/>
<rect x="1100" y="140" width="640" height="34" rx="10" fill="#1d4ed8"/>
<rect x="1100" y="164" width="640" height="10" fill="#1d4ed8"/>
<text x="1114" y="163.0" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">PLACA MOSFET 4 CANALES · entradas de señal</text>
<text x="684" y="255" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">GPIO 25</text>
<text x="684" y="275" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="end">Canal 1 · foco izquierdo</text>
<text x="1118" y="255" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">IN 01</text>
<text x="1118" y="275" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="start">→ OUT 1</text>
<text x="684" y="335" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">GPIO 32</text>
<text x="684" y="355" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="end">Canal 2 · foco derecho</text>
<text x="1118" y="335" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">IN 02</text>
<text x="1118" y="355" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="start">→ OUT 2</text>
<text x="684" y="415" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">GPIO 33</text>
<text x="684" y="435" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="end">Canal 3 · faros de niebla</text>
<text x="1118" y="415" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">IN 03</text>
<text x="1118" y="435" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="start">→ OUT 3</text>
<text x="684" y="495" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">GPIO 18</text>
<text x="684" y="515" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="end">Canal 4 · bocina / freno / aux</text>
<text x="1118" y="495" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">IN 04</text>
<text x="1118" y="515" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="start">→ OUT 4</text>
<text x="684" y="575" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="end">GND</text>
<text x="684" y="595" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="end">masa lógica</text>
<text x="1118" y="575" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="start">GND</text>
<text x="1118" y="595" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="start">masa de entrada</text>
<text x="80" y="215" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">PWM 3,3 V · 1 kHz · activo a nivel ALTO</text>
<text x="80" y="600" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Sin cables de potencia aquí: solo señal.</text>
<text x="60" y="666" font-size="17" fill="#facc15" font-weight="bold" text-anchor="start">LISTA DE CABLES · HOJA 3</text>
<rect x="60" y="680" width="1010" height="36" fill="#222a3a"/>
<text x="76" y="703.0" font-size="13" fill="#9ca3af" font-weight="bold" text-anchor="start">ID</text>
<text x="146" y="703.0" font-size="13" fill="#9ca3af" font-weight="bold" text-anchor="start">DE  →  A</text>
<text x="786" y="703.0" font-size="13" fill="#9ca3af" font-weight="bold" text-anchor="start">CABLE</text>
<rect x="60" y="716" width="1010" height="36" fill="#121722"/>
<rect x="60" y="716" width="6" height="36" fill="#e5e7eb"/>
<text x="78" y="739.0" font-size="15" fill="#e5e7eb" font-weight="bold" text-anchor="start">W11</text>
<text x="146" y="739.0" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">LILYGO GPIO 25  →  Placa MOSFET IN 01</text>
<text x="786" y="739.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 24 · blanco</text>
<rect x="60" y="752" width="1010" height="36" fill="#171d2b"/>
<rect x="60" y="752" width="6" height="36" fill="#facc15"/>
<text x="78" y="775.0" font-size="15" fill="#facc15" font-weight="bold" text-anchor="start">W12</text>
<text x="146" y="775.0" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">LILYGO GPIO 32  →  Placa MOSFET IN 02</text>
<text x="786" y="775.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 24 · amarillo</text>
<rect x="60" y="788" width="1010" height="36" fill="#121722"/>
<rect x="60" y="788" width="6" height="36" fill="#60a5fa"/>
<text x="78" y="811.0" font-size="15" fill="#60a5fa" font-weight="bold" text-anchor="start">W13</text>
<text x="146" y="811.0" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">LILYGO GPIO 33  →  Placa MOSFET IN 03</text>
<text x="786" y="811.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 24 · azul</text>
<rect x="60" y="824" width="1010" height="36" fill="#171d2b"/>
<rect x="60" y="824" width="6" height="36" fill="#f87171"/>
<text x="78" y="847.0" font-size="15" fill="#f87171" font-weight="bold" text-anchor="start">W14</text>
<text x="146" y="847.0" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">LILYGO GPIO 18  →  Placa MOSFET IN 04</text>
<text x="786" y="847.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 24 · rojo</text>
<rect x="60" y="860" width="1010" height="36" fill="#121722"/>
<rect x="60" y="860" width="6" height="36" fill="#6b7280"/>
<text x="78" y="883.0" font-size="15" fill="#6b7280" font-weight="bold" text-anchor="start">W15</text>
<text x="146" y="883.0" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">LILYGO GND (header)  →  Placa MOSFET GND de entrada</text>
<text x="786" y="883.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 24 · negro</text>
<rect x="1130" y="680" width="610" height="144" rx="8" fill="#1a1710" stroke="#f59e0b" stroke-width="1.8"/>
<text x="1146" y="708" font-size="15" fill="#f59e0b" font-weight="bold" text-anchor="start">NOTAS</text>
<text x="1146" y="732" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">• La placa MOSFET lleva entrada PNP (3,3–5 V):</text>
<text x="1146" y="756" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">  se activa con nivel ALTO desde el ESP32.</text>
<text x="1146" y="780" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">• W15 es obligatorio: sin masa común de señal</text>
<text x="1146" y="804" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">  el optoacoplador no conmuta.</text>
<path d="M 700 250 L 1100 250" fill="none" stroke="#e5e7eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 700 330 L 1100 330" fill="none" stroke="#facc15" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
