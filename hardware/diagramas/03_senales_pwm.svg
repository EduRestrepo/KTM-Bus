<circle cx="1100" cy="410" r="8" fill="#0b0f16" stroke="#60a5fa" stroke-width="3.5"/><circle cx="1100" cy="410" r="2.5" fill="#60a5fa"/>
<circle cx="700" cy="490" r="8" fill="#0b0f16" stroke="#f87171" stroke-width="3.5"/><circle cx="700" cy="490" r="2.5" fill="#f87171"/>
<circle cx="1100" cy="490" r="8" fill="#0b0f16" stroke="#f87171" stroke-width="3.5"/><circle cx="1100" cy="490" r="2.5" fill="#f87171"/>
<circle cx="700" cy="570" r="8" fill="#0b0f16" stroke="#6b7280" stroke-width="3.5"/><circle cx="700" cy="570" r="2.5" fill="#6b7280"/>
<circle cx="1100" cy="570" r="8" fill="#0b0f16" stroke="#6b7280" stroke-width="3.5"/><circle cx="1100" cy="570" r="2.5" fill="#6b7280"/>
<rect x="876.5" y="238" width="47" height="24" rx="6" fill="#0b0f16" stroke="#e5e7eb" stroke-width="2"/>
<text x="900" y="255" font-size="14" font-weight="bold" fill="#e5e7eb" text-anchor="middle">W11</text>
<rect x="876.5" y="318" width="47" height="24" rx="6" fill="#0b0f16" stroke="#facc15" stroke-width="2"/>
<text x="900" y="335" font-size="14" font-weight="bold" fill="#facc15" text-anchor="middle">W12</text>
<rect x="876.5" y="398" width="47" height="24" rx="6" fill="#0b0f16" stroke="#60a5fa" stroke-width="2"/>
<text x="900" y="415" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">W13</text>
<rect x="876.5" y="478" width="47" height="24" rx="6" fill="#0b0f16" stroke="#f87171" stroke-width="2"/>
<text x="900" y="495" font-size="14" font-weight="bold" fill="#f87171" text-anchor="middle">W14</text>
<rect x="876.5" y="558" width="47" height="24" rx="6" fill="#0b0f16" stroke="#6b7280" stroke-width="2"/>
<text x="900" y="575" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">W15</text>
</svg>