<text x="78" y="195" font-size="14" fill="#93c5fd" font-weight="bold" text-anchor="start">(−) GND  → W4</text>
<text x="78" y="255" font-size="14" fill="#93c5fd" font-weight="bold" text-anchor="start">(−) GND  → W5</text>
