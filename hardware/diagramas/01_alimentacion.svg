<text x="78" y="645" font-size="14" fill="#93c5fd" font-weight="bold" text-anchor="start">DC− (GND)</text>
<text x="410" y="720" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="middle">Entradas 01–04: Hoja 3   ·   Salidas OUT 1–4: Hoja 4</text>
<text x="410" y="750" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="middle">Máx. 5 A por canal</text>
