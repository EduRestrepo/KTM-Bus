<text x="30" y="32" font-size="24" font-weight="bold" fill="#ff6a13">KTM 1290 CANsmart · HOJA 1/4 — ALIMENTACIÓN Y MASAS</text>
<text x="30" y="56" font-size="14" fill="#9ca3af">Batería → portafusible → convertidor 5 V → LILYGO · y alimentación de potencia de la placa MOSFET</text>
<rect x="60" y="150" width="280" height="230" rx="10" fill="#161b26" stroke="#ef4444" stroke-width="2.5"/>
<rect x="60" y="150" width="280" height="34" rx="10" fill="#ef4444"/>
