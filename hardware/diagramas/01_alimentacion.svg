<text x="1446" y="647.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 18 negro · anilla M6</text>
<rect x="860" y="660" width="840" height="36" fill="#121722"/>
<rect x="860" y="660" width="6" height="36" fill="#3b82f6"/>
