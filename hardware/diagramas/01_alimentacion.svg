<text x="1285" y="325" font-size="13" fill="#cbd5e1" font-weight="bold" text-anchor="end">OUT (−) GND</text>
<text x="1150" y="365" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="middle">3 A · sellado IP67</text>
