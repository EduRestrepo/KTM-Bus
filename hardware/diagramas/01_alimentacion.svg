<text x="1446" y="755.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 20 negro</text>
<rect x="860" y="810" width="840" height="96" rx="8" fill="#1a1710" stroke="#f59e0b" stroke-width="1.8"/>
<text x="876" y="838" font-size="15" fill="#f59e0b" font-weight="bold" text-anchor="start">ORDEN DE MONTAJE</text>
<text x="876" y="862" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">1. Desconecta el borne (−) de la batería antes de empezar.</text>
<text x="876" y="886" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">2. Deja el portafusible SIN el fusible de 30 A hasta terminar y revisar con multímetro.</text>
