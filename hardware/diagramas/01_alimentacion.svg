<text x="1466" y="325" font-size="13" fill="#cbd5e1" font-weight="bold" text-anchor="start">GND</text>
<text x="1600" y="365" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="middle">CAN → Hoja 2 · GPIO → Hoja 3</text>
