<text x="676" y="280" font-size="13" fill="#6ee7b7" font-weight="bold" text-anchor="end">OUT</text>
<text x="580" y="298" font-size="12" fill="#9ca3af" font-weight="normal" text-anchor="middle">fusible 30 A (poner al FINAL)</text>
