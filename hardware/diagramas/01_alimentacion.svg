<text x="1446" y="683.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 14 negro · anilla M6</text>
<rect x="860" y="696" width="840" height="36" fill="#171d2b"/>
<rect x="860" y="696" width="6" height="36" fill="#22d3ee"/>
<text x="878" y="719.0" font-size="15" fill="#22d3ee" font-weight="bold" text-anchor="start">W6</text>
<text x="946" y="719.0" font-size="14" fill="#e5e7eb" font-weight="normal" text-anchor="start">Convertidor OUT (+) 5 V  →  LILYGO VIN</text>
<text x="1446" y="719.0" font-size="14" fill="#9ca3af" font-weight="normal" text-anchor="start">AWG 20 rojo</text>
